<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puerto Rico Flood Risk | Swiss Style</title>
    
    <!-- MapLibre GL JS CSS -->
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- SWISS DESIGN SYSTEM --- */
        :root {
            /* Risk Colors */
            --color-coastal: #af52de;  /* Zone VE - Purple */
            --color-high-ae: #ff3b30;  /* Zone AE - Swiss Red */
            --color-high-a:  #ff9500;  /* Zone A/AH/AO - Deep Orange */
            --color-moderate:#ffcc00;  /* 0.2% - Gold/Yellow */
            --color-minimal: #e5e5ea;  /* Minimal - Grey */
            
            /* UI Colors */
            --swiss-black: #1c1c1e;
            --swiss-white: #ffffff;
            --swiss-grey:  #e5e5ea;
            
            --ui-shadow: 0 12px 40px rgba(0,0,0,0.12);
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: var(--font-stack);
            color: var(--swiss-black);
            overflow: hidden;
            background-color: #f2f2f7;
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 9999; /* Topmost layer */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--swiss-grey);
            border-top: 4px solid var(--color-high-ae); /* Red spinner */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        .loader-text {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--swiss-black);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* --- MAP CONTAINER --- */
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        /* --- FLOATING UI PANEL --- */
        .ui-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 340px;
            background: rgba(255, 255, 255, 0.98);
            padding: 32px;
            z-index: 10;
            box-shadow: var(--ui-shadow);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        p.subtitle {
            font-size: 13px;
            line-height: 1.5;
            color: #666;
            margin: 0;
            font-weight: 400;
        }

        /* --- SEARCH BAR --- */
        .search-container { width: 100%; }

        .search-box {
            display: flex;
            align-items: center;
            border: 1px solid var(--swiss-grey);
            border-radius: 4px;
            padding: 4px 8px;
            transition: border-color 0.2s;
            background: white;
        }

        .search-box:focus-within {
            border-color: var(--swiss-black);
        }

        #search-input {
            flex: 1;
            border: none;
            outline: none;
            font-family: var(--font-stack);
            font-size: 14px;
            padding: 8px 4px;
            color: var(--swiss-black);
            background: transparent;
        }

        #search-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: var(--swiss-black);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #search-button:hover { opacity: 0.6; }

        #search-status {
            font-size: 11px;
            margin-top: 8px;
            color: #666;
            font-weight: 500;
            min-height: 14px;
        }

        /* --- TOGGLES --- */
        .toggle-group {
            display: flex;
            background: #f2f2f7;
            padding: 4px;
            border-radius: 6px;
        }

        .toggle-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            font-family: var(--font-stack);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .toggle-btn.active {
            background: var(--swiss-white);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* --- LEGEND --- */
        .legend-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 500;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 12px;
        }

        /* --- POPUP --- */
        .maplibregl-popup-content {
            padding: 20px;
            font-family: var(--font-stack);
            box-shadow: var(--ui-shadow);
            border-radius: 4px;
            max-width: 280px;
            border: 1px solid #eee;
        }
        
        .maplibregl-popup-close-button {
            padding: 8px;
            color: #999;
            font-size: 16px;
        }

        .popup-zone {
            font-size: 18px;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        .popup-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            .ui-panel {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                box-sizing: border-box;
                padding: 24px;
                border-radius: 12px 12px 0 0;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading Flood Data...</div>
    </div>

    <!-- UI Panel -->
    <div class="ui-panel">
        <div>
            <h1>Flood Risk PR</h1>
            <p class="subtitle">Interactive visualization of flood hazard areas.</p>
        </div>

        <!-- Search -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search city, street..." />
                <button id="search-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            <div id="search-status"></div>
        </div>

        <!-- Toggles -->
        <div class="toggle-group">
            <button id="btn-simple" class="toggle-btn active">Map</button>
            <button id="btn-satellite" class="toggle-btn">Satellite</button>
        </div>

        <!-- Legend -->
        <div>
            <div class="legend-title">Risk Designation</div>
            
            <div class="legend-item">
                <span class="color-dot" style="background: var(--color-coastal);"></span>
                <span>Coastal Storm (VE)</span>
            </div>
            <div class="legend-item">
                <span class="color-dot" style="background: var(--color-high-ae);"></span>
                <span>High Risk (Zone AE)</span>
            </div>
            <div class="legend-item">
                <span class="color-dot" style="background: var(--color-high-a);"></span>
                <span>High Risk (Zone A, AH, AO)</span>
            </div>
            <div class="legend-item">
                <span class="color-dot" style="background: var(--color-moderate);"></span>
                <span>Moderate (0.2% / X-Shaded)</span>
            </div>
            <div class="legend-item">
                <span class="color-dot" style="background: #e5e5ea; border: 1px solid #ccc;"></span>
                <span>Minimal Risk</span>
            </div>
        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Libraries -->
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>

    <script>
        // 1. Initialize Map
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'simple-tiles': {
                        type: 'raster',
                        tiles: ['https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'],
                        tileSize: 256,
                        attribution: '&copy; OpenStreetMap &copy; CARTO'
                    },
                    'satellite-tiles': {
                        type: 'raster',
                        tiles: ['https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256,
                        attribution: 'USGS The National Map'
                    }
                },
                layers: [
                    {
                        id: 'satellite-layer',
                        type: 'raster',
                        source: 'satellite-tiles',
                        paint: { 'raster-opacity': 0 }
                    },
                    {
                        id: 'simple-layer',
                        type: 'raster',
                        source: 'simple-tiles',
                        paint: { 'raster-opacity': 1 }
                    }
                ]
            },
            center: [-66.45, 18.22], 
            zoom: 9,
            maxZoom: 18,
            pitch: 0
        });

        // 2. Search Functionality
        let searchResultMarker = null;
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const searchStatus = document.getElementById('search-status');

        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                performSearch();
            }
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) {
                searchStatus.textContent = 'Please enter a location.';
                return;
            }

            searchStatus.textContent = 'Searching...';
            // Puerto Rico Bounding Box
            const viewbox = '-67.95,18.52,-65.22,17.92'; 
            const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}, Puerto Rico&format=json&limit=1&bounded=1&viewbox=${viewbox}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                if (data && data.length > 0) {
                    const result = data[0];
                    const lat = parseFloat(result.lat);
                    const lon = parseFloat(result.lon);

                    searchStatus.textContent = `Found: ${result.display_name.split(',')[0]}`;

                    map.flyTo({
                        center: [lon, lat],
                        zoom: 15,
                        essential: true
                    });

                    if (searchResultMarker) searchResultMarker.remove();
                    
                    const el = document.createElement('div');
                    el.style.width = '20px';
                    el.style.height = '20px';
                    el.style.borderRadius = '50%';
                    el.style.backgroundColor = '#ff3b30';
                    el.style.border = '3px solid white';
                    el.style.boxShadow = '0 2px 10px rgba(0,0,0,0.2)';

                    searchResultMarker = new maplibregl.Marker({ element: el })
                        .setLngLat([lon, lat])
                        .addTo(map);

                } else {
                    searchStatus.textContent = 'No results found.';
                    if (searchResultMarker) {
                        searchResultMarker.remove();
                        searchResultMarker = null;
                    }
                }
            } catch (error) {
                searchStatus.textContent = 'Error searching.';
                console.error(error);
            }
        }

        // 3. Load Flood Data with Loader Logic
        map.on('load', () => {

            // LOAD FROM EXTERNAL FILE (Requires local server)
            map.addSource('flood-data', {
                type: 'geojson',
                data: 'data/puerto_rico_alto_riesgo_simplified.json' 
            });

            // FILL LAYER
            map.addLayer({
                'id': 'flood-fill',
                'type': 'fill',
                'source': 'flood-data',
                'layout': {},
                'paint': {
                    'fill-color': [
                        'match',
                        ['get', 'FLD_ZONE'],
                        'VE', '#af52de', // Coastal Purple
                        'AE', '#ff3b30', // High Red
                        'A',  '#ff9500', // High Orange
                        'AH', '#ff9500', // High Orange
                        'AO', '#ff9500', // High Orange
                        'X',  [
                                'case',
                                ['==', ['get', 'ZONE_SUBTY'], '0.2 PCT ANNUAL CHANCE FLOOD HAZARD'],
                                '#ffcc00', // Moderate Yellow
                                'rgba(0,0,0,0)' // Minimal Transparent
                              ],
                        '#cccccc' // Default
                    ],
                    'fill-opacity': 0.6
                }
            });

            // OUTLINE LAYER
            map.addLayer({
                'id': 'flood-line',
                'type': 'line',
                'source': 'flood-data',
                'layout': {},
                'paint': {
                    'line-color': '#000000',
                    'line-width': 0.5,
                    'line-opacity': 0.15
                }
            });

            // --- LOADER REMOVAL LOGIC ---
            // We listen for the 'data' event. When the 'flood-data' source 
            // is fully loaded and rendered, we hide the loader.
            
            const hideLoader = () => {
                const loader = document.getElementById('loader');
                if (loader && !loader.classList.contains('fade-out')) {
                    loader.classList.add('fade-out');
                    // Completely remove from DOM after fade transition (0.5s)
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 500);
                }
            };

            // Option A: Hide when the specific source is idle
            map.on('idle', () => {
                hideLoader();
            });
            
            // Option B: Fallback timeout (in case data is empty or too fast)
            setTimeout(hideLoader, 3000); 
        });

        // 4. Popups
        map.on('click', 'flood-fill', (e) => {
            const props = e.features[0].properties;
            
            let riskLevel = "Unknown";
            let color = "#333";
            const zone = props.FLD_ZONE;
            const subtype = props.ZONE_SUBTY;

            if(zone === "VE") { 
                riskLevel = "Coastal Storm High Hazard"; 
                color = "#af52de"; 
            }
            else if (zone === "AE") { 
                riskLevel = "1% Annual Chance (Detailed)"; 
                color = "#ff3b30"; 
            }
            else if (["A", "AH", "AO"].includes(zone)) { 
                riskLevel = "1% Annual Chance (Shallow/Approx)"; 
                color = "#ff9500"; 
            }
            else if (subtype === "0.2 PCT ANNUAL CHANCE FLOOD HAZARD") { 
                riskLevel = "0.2% Annual Chance (Moderate)"; 
                color = "#ffcc00"; 
            }
            else { 
                riskLevel = "Minimal Flood Hazard"; 
                color = "#999"; 
            }

            const description = `
                <span class="popup-zone" style="color: ${color}">Zone ${zone}</span>
                <div class="popup-desc">
                    <strong>Risk:</strong> ${riskLevel}<br>
                    ${subtype ? `<strong>Type:</strong> ${subtype}<br>` : ''}
                    ${props.STATIC_BFE && props.STATIC_BFE > -9999 ? `<strong>Elevation:</strong> ${props.STATIC_BFE}ft` : ''}
                </div>
            `;

            new maplibregl.Popup()
                .setLngLat(e.lngLat)
                .setHTML(description)
                .addTo(map);
        });

        map.on('mouseenter', 'flood-fill', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'flood-fill', () => map.getCanvas().style.cursor = '');

        // 5. Toggles
        const btnSimple = document.getElementById('btn-simple');
        const btnSatellite = document.getElementById('btn-satellite');

        btnSimple.onclick = () => {
            btnSimple.classList.add('active');
            btnSatellite.classList.remove('active');
            map.setPaintProperty('simple-layer', 'raster-opacity', 1);
            map.setPaintProperty('satellite-layer', 'raster-opacity', 0);
            if(map.getLayer('flood-fill')) map.setPaintProperty('flood-fill', 'fill-opacity', 0.6);
        };

        btnSatellite.onclick = () => {
            btnSatellite.classList.add('active');
            btnSimple.classList.remove('active');
            map.setPaintProperty('simple-layer', 'raster-opacity', 0);
            map.setPaintProperty('satellite-layer', 'raster-opacity', 1);
            if(map.getLayer('flood-fill')) map.setPaintProperty('flood-fill', 'fill-opacity', 0.35);
        };

    </script>
</body>
</html>
